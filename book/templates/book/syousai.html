{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>書籍詳細</title>
	<link rel="stylesheet" href="{% static 'book/css/style.css' %}">
</head>
<body>
	<div class="container">
		<h1>書籍詳細</h1>
		<table>
			<tr><th>タイトル</th><td>{{ book.title }}</td></tr>
			<tr><th>著者</th><td>{{ book.author }}</td></tr>
			<tr><th>ジャンル</th><td>{{ book.genre.name }}</td></tr>
			<tr><th>価格</th><td>{{ book.price }}</td></tr>
			<tr><th>出版日</th><td>{{ book.pub_date }}</td></tr>
			<tr><th>説明</th><td>{{ book.description }}</td></tr>
		</table>
		<p>
			<a href="{% url 'book_update' book.id %}">編集</a>
			<a href="{% url 'book_delete' book.id %}">削除</a>
			<a href="{% url 'index' %}">戻る</a>
		</p>
	</div>
</body>
</html>
