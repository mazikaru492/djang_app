{% load static %}
<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>{{ title }}</title>
    <link rel="stylesheet" type="text/css"
        href="{% static 'syllabus/css/style.css' %}" />
  </head>
  <body>
    <h1>{{ title }}</h1>

    <p>以下の講義を削除してもよろしいですか？</p>
    <p><strong>{{ course.title }}</strong>（担当: {{ course.teacher }}）</p>

    <form method="post">
      {% csrf_token %}
      <input type="submit" value="はい、削除します">
    </form>

    <br>
    <a href="{% url 'syllabus:index' %}">← 一覧に戻る</a>
  </body>
</html>
