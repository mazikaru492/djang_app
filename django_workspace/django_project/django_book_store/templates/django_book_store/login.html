{% load static %}
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン</title>
  <link rel="stylesheet" href="{% static 'django_book_store/css/style.css' %}">
</head>
<body>
  <h1>ログイン</h1>
  {{ form.non_field_errors }}
  <form method="post" action="{% url 'django_book_store:login' %}">
    {% csrf_token %}
    {% for field in form %}
      <p>
        <label for="{{ field.id_for_label }}">{{ field.label }}</label><br>
        {{ field }}
        {{ field.errors }}
      </p>
    {% endfor %}
    <button type="submit">ログイン</button>
  </form>
</body>
</html>
