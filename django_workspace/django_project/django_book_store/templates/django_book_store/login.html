<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン</title>
  <style>
    body { margin: 24px; font-family: sans-serif; }
    input { max-width: 100%; box-sizing: border-box; }
  </style>
</head>
<body>
  <h1>ログイン</h1>
  {% if employee %}
    <p role="status">ログインしました。</p>
    <p>{{ employee.employee_name }}さん（{{ employee.employee_no }}）</p>
    <form method="post" action="{% url 'django_book_store:logout' %}">
      {% csrf_token %}
      <button type="submit">ログアウト</button>
    </form>
  {% else %}
  {{ form.non_field_errors }}
  <form method="post" action="{% url 'django_book_store:login' %}">
    {% csrf_token %}
    {% for field in form %}
      <p>
        <label for="{{ field.id_for_label }}">{{ field.label }}</label><br>
        {{ field }}
        {{ field.errors }}
      </p>
    {% endfor %}
    <button type="submit">ログイン</button>
  </form>
  {% endif %}
</body>
</html>
